<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lio Photography</title>
  <link rel="stylesheet" href="assets/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Hero Section -->
  <header class="hero">
    <img src="images/hero.jpg" alt="Meteor Hero" class="hero-img" />
    <div class="hero-text">
      <h1>Lio Photography</h1>
      <p>Chasing the stars · Capturing the light</p>
      <a href="#gallery" class="btn">Enter Gallery</a>
    </div>
  </header>

  <!-- Gallery Section -->
  <section id="gallery" class="section">
    <h2>Photography Works</h2>
    <div id="gallery-grid" class="grid"></div>
  </section>

  <!-- Video Section -->
  <section id="videos" class="section">
    <h2>Video Works</h2>
    <div id="video-grid" class="grid"></div>
  </section>

  <!-- Contact Section -->
  <section id="contact" class="section contact">
    <h2>Contact</h2>
    <p>Email: <a href="mailto:lio@example.com">lio@example.com</a></p>
    <!-- Optional: Add QR code or other contact info here -->
  </section>

  <!-- Footer -->
  <footer>
    <p>© 2025 Lio Photography. All rights reserved.</p>
  </footer>

  <script src="assets/script.js"></script>
</body>
</html>
