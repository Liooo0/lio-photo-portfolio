<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lio 摄影作品集</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    /* Hero 区域 */
    .hero {
      height: 100vh;
      background: url('images/hero.jpg') center/cover no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
    }
    .hero img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #fff;
      margin-bottom: 20px;
    }
    .hero h1 {
      font-size: 2.5rem;
      margin: 10px 0;
    }
    .hero p {
      font-size: 1.2rem;
      color: #ddd;
      max-width: 600px;
    }

    /* 图片展示区 */
    .gallery {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 10px;
    }
    .gallery img {
      width: 100%;
      height: 100vh;
      object-fit: cover;
      border-radius: 12px;
    }
    .gallery .full {
      grid-column: span 2;
    }

    @media (max-width: 768px) {
      .gallery {
        grid-template-columns: 1fr;
      }
      .gallery .full {
        grid-column: span 1;
      }
      .gallery img {
        height: auto;
      }
    }

    /* 页脚 */
    footer {
      text-align: center;
      padding: 30px 10px;
      background: #000;
      color: #aaa;
      margin-top: 30px;
    }
    footer a {
      color: #ddd;
      text-decoration: none;
      margin: 0 10px;
    }
    footer a:hover {
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Hero 区域 -->
  <div class="hero">
    <img src="images/avatar.jpg" alt="Lio">
    <h1>Lio 摄影作品</h1>
    <p>自由摄影师 | 记录生活与自然的光影瞬间</p>
  </div>

  <!-- 五张图 -->
  <div class="gallery">
    <img src="images/pet.jpg" alt="宠物">
    <img src="images/sunset.jpg" alt="晚霞">

    <img src="images/lotus.jpg" alt="荷花">
    <img src="images/travel-car.jpg" alt="旅行合影">

    <img src="images/extra.jpg" alt="第五张" class="full">
  </div>

  <!-- 页脚 -->
  <footer>
    <p>联系方式：
      <a href="mailto:yourname@email.com">yourname@email.com</a> |
      <a href="https://instagram.com/yourid" target="_blank">Instagram</a>
    </p>
    <p>© 2025 Lio 摄影作品集. 保留所有权利.</p>
  </footer>

</body>
</html>
