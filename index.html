<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lio 摄影作品集</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-content">
      <h1>Lio 摄影作品集</h1>
      <p class="hero-subtitle">光影捕手 · 松下S5II</p>
    </div>
    <div class="scroll-hint">
      <span>Scroll</span>
      <div class="scroll-line"></div>
    </div>
  </section>

  <!-- About -->
  <section class="about">
    <img class="avatar" src="avatar.jpg" alt="Lio">
    <h2>刘迪迪 · Lio</h2>
    <p class="tagline">光影捕手｜松下S5II创作者｜风景摄影师</p>
    <div class="gear">
      <span class="gear-tag">Panasonic S5II</span>
      <span class="gear-tag">Lightroom</span>
      <span class="gear-tag">Photoshop</span>
    </div>
  </section>

  <!-- Filter Bar -->
  <div class="filter-bar" id="filterBar"></div>

  <!-- Gallery -->
  <section class="gallery-section">
    <div class="gallery" id="gallery"></div>
    <div class="load-more-wrap" id="loadMoreWrap">
      <button class="load-more-btn" id="loadMoreBtn">加载更多</button>
    </div>
  </section>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close">&times;</button>
    <button class="lightbox-prev">&lsaquo;</button>
    <button class="lightbox-next">&rsaquo;</button>
    <img src="" alt="">
    <span class="lightbox-counter"></span>
  </div>

  <!-- Back to Top -->
  <button class="back-to-top" id="backToTop" aria-label="返回顶部">&uarr;</button>

  <!-- Footer -->
  <footer>
    <p>联系方式：<a href="mailto:lio.photography@email.com">lio.photography@email.com</a></p>
    <p>&copy; 2025 Lio 摄影作品集</p>
  </footer>

  <script src="assets/script.js"></script>
</body>
</html>
