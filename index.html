<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LIO 的摄影作品集</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f8f9fa;
      color: #333;
      line-height: 1.6;
    }

    /* Header 样式 */
    .profile-header {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      text-align: center;
      padding: 60px 20px 40px;
    }

    .avatar {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.3);
      object-fit: cover;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      margin-bottom: 20px;
    }

    .profile-info h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .profile-info p {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    /* 作品集区域 */
    .gallery {
      max-width: 1200px;
      margin: 40px auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 25px;
      padding: 0 20px;
    }

    .item {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
      transition: transform 0.3s ease;
    }

    .item:hover {
      transform: translateY(-8px);
    }

    .item img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .info {
      padding: 15px;
    }

    .info h3 {
      font-size: 1.1rem;
      margin: 0 0 5px;
    }

    .info p {
      font-size: 0.9rem;
      color: #777;
      margin: 0;
    }

    /* Footer 样式 */
    footer {
      text-align: center;
      padding: 30px 10px;
      color: #666;
      font-size: 0.95rem;
      border-top: 1px solid #e1e1e1;
      margin-top: 40px;
    }

    footer a {
      color: #1e3c72;
      text-decoration: none;
      font-weight: 500;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header class="profile-header">
    <img src="avatar.jpg" alt="摄影师头像" class="avatar" />
    <div class="profile-info">
      <h1>刘迪迪 - LIO</h1>
      <p>光影捕手｜松下 S5II + 适马 28-70 f2.8 创作者</p>
    </div>
  </header>

  <!-- Gallery -->
  <main>
    <div class="gallery" id="gallery"></div>
  </main>

  <!-- Footer -->
  <footer>
    📫 联系我：<a href="mailto:youremail@example.com">youremail@example.com</a>
  </footer>

  <!-- Script -->
  <script>
    fetch('gallery.json')
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('gallery');
        data.forEach(item => {
          const div = document.createElement('div');
          div.className = 'item';
          div.innerHTML = `
            <img src="${item.src}" alt="${item.title}" loading="lazy">
            <div class="info">
              <h3>${item.title}</h3>
              <p>${item.category} | ${item.date}</p>
            </div>
          `;
          container.appendChild(div);
        });
      });
  </script>
</body>
</html>
