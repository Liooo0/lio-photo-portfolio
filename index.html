<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lio 摄影作品集</title>
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    /* 首页 Hero 大图 */
    .hero {
      height: 100vh;
      background: url('images/best2025.jpg') center/cover no-repeat;
    }

    /* 头像与简介 */
    .intro {
      text-align: center;
      padding: 60px 20px;
    }
    .intro img {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 4px solid #fff;
      margin-bottom: 25px;
    }
    .intro h1 {
      font-size: 3rem;
      margin: 15px 0;
      font-weight: bold;
    }
    .intro p {
      font-size: 1.3rem;
      color: #ddd;
    }

    /* 图片展示区 */
    .gallery {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 20px;
    }
    .gallery img {
      width: 100%;
      height: 90vh;
      object-fit: cover;
      border-radius: 12px;
    }

    @media (max-width: 768px) {
      .gallery {
        grid-template-columns: 1fr;
      }
      .gallery img {
        height: auto;
      }
    }

    /* 页脚 */
    footer {
      text-align: center;
      padding: 30px 10px;
      background: #000;
      color: #aaa;
      margin-top: 30px;
    }
    footer a {
      color: #ddd;
      text-decoration: none;
      margin: 0 10px;
    }
    footer a:hover {
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- 首页 Hero 大图 -->
  <div class="hero" data-aos="fade-in"></div>

  <!-- 头像与简介 -->
  <div class="intro" data-aos="zoom-in">
    <img src="images/avatar.jpg" alt="Lio">
    <h1>Lio 摄影作品</h1>
    <p>自由摄影师 | 记录生活与自然的光影瞬间</p>
  </div>

  <!-- 四张图 -->
  <div class="gallery">
    <img src="images/pet.jpg" alt="宠物" data-aos="fade-up">
    <img src="images/sunset.jpg" alt="晚霞" data-aos="fade-up" data-aos-delay="100">
    <img src="images/lotus.jpg" alt="荷花" data-aos="fade-up" data-aos-delay="200">
    <img src="images/travel-car.jpg" alt="旅行合影" data-aos="fade-up" data-aos-delay="300">
  </div>

  <!-- 页脚 -->
  <footer data-aos="fade-in">
    <p>联系方式：
      <a href="mailto:lio.photography@email.com">lio.photography@email.com</a>
    </p>
    <p>© 2025 Lio 摄影作品集. 保留所有权利.</p>
  </footer>

  <!-- AOS 动画脚本 -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({
      duration: 1200, // 动画时长
      once: true     // 滚动过后不重复
    });
  </script>
</body>
</html>
