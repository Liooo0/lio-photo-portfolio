<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lio 摄影作品集</title>
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    /* 首页 Hero 大图 */
    .hero {
      height: 100vh;
      background: url('images/best2025.jpg') center/cover no-repeat;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 首页文字 */
    .hero-title {
      position: absolute;
      font-size: 3rem;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 15px 25px;
      border-radius: 8px;
      opacity: 0;
      transform: scale(0.8);
      transition: all 1s ease;
    }
    .hero-title.show {
      opacity: 1;
      transform: scale(1);
    }

    /* 头像与简介 */
    .intro {
      text-align: center;
      padding: 60px 20px;
    }
    .intro img {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 4px solid #fff;
      margin-bottom: 25px;
    }
    .intro h1 {
      font-size: 3rem;
      margin: 15px 0;
      font-weight: bold;
    }
    .intro p {
      font-size: 1.3rem;
      color: #ddd;
    }

    /* 图片展示区 */
    .gallery {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 20px;
    }
    .gallery img {
      width: 100%;
      height: 90vh;
      object-fit: cover;
      border-radius: 12px;
    }

    @media (max-width: 768px) {
      .gallery {
        grid-template-columns: 1fr;
      }
      .gallery img {
        height: auto;
      }
    }

    /* 页脚 */
    footer {
      text-align: center;
      padding: 30px 10px;
      background: #000;
      color: #aaa;
      margin-top: 30px;
    }
    footer a {
      color: #ddd;
      text-decoration: none;
      margin: 0 10px;
    }
    footer a:hover {
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- 首页 Hero 大图 -->
  <div class="hero">
    <div class="hero-title">2025年度最佳作品
    摄影师：lio</div>
  </div>


  <!-- 头像与简介 -->
<header class="profile-header">
    <img src="avatar.jpg" alt="摄影师头像" class="avatar" />
    <div class="profile-info">
      <h1>刘迪迪 - LIO</h1>
      <p>光影捕手｜松下S5II创作者｜风景摄影师</p>
    </div>
  </header>
   

  <!-- 四张图 -->
  <div class="gallery">
    <img src="images/pet.jpg" alt="宠物" data-aos="fade-up">
    <img src="images/sunset.jpg" alt="晚霞" data-aos="fade-up" data-aos-delay="100">
    <img src="images/lotus.jpg" alt="荷花" data-aos="fade-up" data-aos-delay="200">
    <img src="images/travel-car.jpg" alt="旅行合影" data-aos="fade-up" data-aos-delay="300">
  </div>

  <!-- 页脚 -->
  <footer data-aos="fade-in">
    <p>联系方式：
      <a href="mailto:lio.photography@email.com">lio.photography@email.com</a>
    </p>
    <p>© 2025 Lio 摄影作品集. 保留所有权利.</p>
  </footer>

  <!-- AOS 动画脚本 -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({
      duration: 1200,
      once: true
    });

    // 延迟 2 秒显示 Hero 标题
    window.addEventListener("load", () => {
      setTimeout(() => {
        document.querySelector(".hero-title").classList.add("show");
      }, 2000);
    });
  </script>
</body>
</html>
