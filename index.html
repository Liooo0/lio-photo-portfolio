<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lio · 摄影作品集</title>
  <link rel="stylesheet" href="assets/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Hero Section -->
  <header class="hero">
    <img src="images/hero.jpg" alt="流星长拖尾" class="hero-img" />
    <div class="hero-overlay">
      <img src="images/avatar.jpg" alt="摄影师头像" class="avatar" />
      <div class="hero-text">
        <h1>Lio · 摄影</h1>
        <p>追逐星辰 · 捕捉光影</p>
        <a href="#gallery" class="btn">进入作品集</a>
      </div>
    </div>
  </header>

  <!-- Gallery Section -->
  <section id="gallery" class="section">
    <h2>摄影作品</h2>
    <div id="gallery-grid" class="grid"></div>
  </section>

  <!-- Contact Section -->
  <section id="contact" class="section contact">
    <h2>联系我</h2>
    <p>邮箱：<a href="mailto:lio@example.com">lio@example.com</a></p>
    <!-- 可选：这里可以加微信二维码或者其他联系方式 -->
  </section>

  <!-- Footer -->
  <footer>
    <p>© 2025 Lio 摄影作品集. 版权所有.</p>
  </footer>

  <script src="assets/script.js"></script>
</body>
</html>
